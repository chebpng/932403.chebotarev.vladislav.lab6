<!DOCTYPE html>
<html lang="ru">
<head>
    <meta name="theme-color" content="#4E342E">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/icons/icon-192.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог книг — Книжный червь (лабораторная №6)</title>

    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h1>Чеботарёв Владислав</h1>
        <h2>Каталог книг</h2>
    </header>

    <nav class="main-nav" aria-label="Основная навигация">
        <a href="/">Каталог</a>
        <a href="/about">О себе</a>
        <a href="/api/books">API книг</a>
        <a href="/api/status">Статус сервера</a>
    </nav>

    <div class="wrapper">
        <main>

            <section id="search">
                <h2>Поиск и фильтрация</h2>
                <form id="filter-form">
                    <label for="author">Автор</label>
                    <input type="search" id="author" name="author" placeholder="Толстой или Tolstoy" autocomplete="off">

                    <label for="year">Год</label>
                    <input type="number" id="year" name="year" placeholder="1869" min="1000" max="2100">

                    <button type="submit">Найти</button>
                    <button type="reset">Сбросить</button>
                </form>

                <p class="catalog-hint">Запрос к серверу: <code id="request-url">/api/books</code></p>
            </section>

            <section id="catalog">
                <h2>Книги (<span id="books-count">0</span>)</h2>
                <p id="catalog-message" class="catalog-message" role="status" aria-live="polite"></p>
                <div class="books" id="catalog-list"></div>
            </section>
        </main>

        <aside>
            <h3>API сервера</h3>
            <p><code>/api/status</code></p>
            <p><code>/api/books</code></p>
            <p><code>/api/books?author=Tolstoy</code></p>
            <p><code>/api/books?year=1869</code></p>

            <button type="button" id="install-app" class="btn" hidden>Установить приложение</button>
        </aside>
    </div>

    <footer>
        <p>© 2026 Чеботарёв Владислав</p>
    </footer>

    <div class="offline-banner" id="offline-banner" hidden>Нет соединения — работает офлайн-режим</div>

    <script src="/catalog.js"></script>
    <script src="/pwa.js"></script>
</body>
</html>
